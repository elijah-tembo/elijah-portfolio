<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>
<link rel="icon" type="image/png" href="images/logos/Elinov.png"> <!-- Uses the Elinov logo in the browser tab -->

<link rel="stylesheet" href="style.css">

<body>

    <!-- Simple password protection -->
<!-- Blocks casual access to the admin page -->
<!-- Change "yourpassword" to something only you know -->
<script>
    const password = prompt("Enter admin password:");
    if (password !== "yourpassword") {
        /* Wrong password — redirect back to homepage */
        document.write("<p>Access denied.</p>");
        window.location.href = "index.html";
    }
</script>

<h2>Portfolio Admin Panel</h2>

<!-- Add Project -->

<h3>Add Project</h3>

<input type="text" id="project-title" placeholder="Project Title">

<input type="text" id="project-image" placeholder="Image URL">

<button onclick="addProject()">Add Project</button>

<!-- Project List -->

<div id="project-list"></div>

<script src="admin.js"></script>

</body>
</html>
